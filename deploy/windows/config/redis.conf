# Redis Windows 配置文件
# 运行时路径会被 deploy.py 替换为绝对路径

# 基础配置
port 6379
bind 127.0.0.1
protected-mode yes

# 数据持久化
dir DATADIR_PLACEHOLDER
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB 快照
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb

# 日志
loglevel notice
logfile LOGFILE_PLACEHOLDER

# 内存限制
maxmemory 256mb
maxmemory-policy allkeys-lru

# 连接配置
timeout 300
tcp-keepalive 300
maxclients 10000

# 后台运行（Windows 不支持 daemonize，由脚本管理）
daemonize no
