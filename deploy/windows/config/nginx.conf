worker_processes  1;

error_log  LOGDIR_PLACEHOLDER/error.log warn;
pid        PIDFILE_PLACEHOLDER/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       NGINXDIR_PLACEHOLDER/conf/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100m;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  LOGDIR_PLACEHOLDER/access.log  main;

    upstream server {
        ip_hash;
        server 127.0.0.1:8081;
    }

    # [DISABLED] 以下服务未在部署中启用
    # upstream monitor-admin {
    #     server 127.0.0.1:9090;
    # }

    # upstream xxljob-admin {
    #     server 127.0.0.1:9100;
    # }

    server {
        listen       LISTEN_PORT_PLACEHOLDER;
        server_name  localhost;

        # 限制外网访问内网 actuator 相关路径
        location ~ ^(/[^/]*)?/actuator(/.*)?$ {
            return 403;
        }

        location / {
            root   HTMLDIR_PLACEHOLDER;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        location /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://server/;
        }

        # [DISABLED] 以下服务未在部署中启用
        # location /admin/ {
        #     proxy_set_header Host $http_host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header REMOTE-HOST $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_pass http://monitor-admin/admin/;
        # }

        # location /xxl-job-admin/ {
        #     proxy_set_header Host $http_host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header REMOTE-HOST $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_pass http://xxljob-admin/xxl-job-admin/;
        # }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
