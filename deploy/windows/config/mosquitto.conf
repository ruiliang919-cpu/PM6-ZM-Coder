# Mosquitto MQTT Broker 配置文件
# 运行时路径会被 deploy.py 替换为绝对路径

# 监听端口（仅本地）
listener 1883 127.0.0.1

# 禁止匿名连接，强制使用密码认证
allow_anonymous false

# 密码文件（由 MosquittoService 自动创建）
password_file PWDFILE_PLACEHOLDER

# 日志配置
log_dest file LOGDIR_PLACEHOLDER/mosquitto.log
log_type error
log_type warning
log_type notice

# PID 文件
pid_file PIDFILE_PLACEHOLDER/mosquitto.pid

# 持久化配置（内存模式，无需磁盘持久化，由应用层管理）
persistence false

# 最大连接数
max_connections 1000
